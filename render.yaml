services:
  # Main PHP Web Service
  - type: web
    name: carelink-php
    runtime: php
    plan: free
    build:
      - command: "composer install --no-dev --optimize-autoloader"
    startCommand: "vendor/bin/heroku-php-apache2 ."
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelink-db
          property: connectionString
      - key: DOCUMENT_ROOT
        value: .

  # Python API Service for Image Diagnosis
  - type: web
    name: carelink-python-api
    runtime: python
    plan: free
    rootDir: ./python_api
    build:
      - command: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production

databases:
  # PostgreSQL Database
  - name: carelink-db
    plan: free
